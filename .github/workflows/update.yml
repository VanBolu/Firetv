name: Update IPTV Playlists

on:
  schedule:
    - cron: "0 4 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    # Bir daha 3-4 saat çalışmasını engeller.
    timeout-minutes: 60

    steps:

      - name: Repository'yi al
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: FFmpeg kur
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: FFprobe kontrol
        run: |
          ffprobe -version | head -n 1

      - name: Playlistleri oluştur
        run: |
          python -u update_playlist.py

      - name: Oluşturulan dosyaları kontrol et
        run: |
          echo ""
          echo "=== DOSYALAR ==="
          ls -lh Turkiye.m3u Dunya.m3u Hotbird.m3u Astra.m3u

          echo ""
          echo "=== KANAL SAYILARI ==="

          echo "Turkiye: $(( ($(wc -l < Turkiye.m3u) - 1) / 2 ))"
          echo "Dunya: $(( ($(wc -l < Dunya.m3u) - 1) / 2 ))"
          echo "Hotbird: $(( ($(wc -l < Hotbird.m3u) - 1) / 2 ))"
          echo "Astra: $(( ($(wc -l < Astra.m3u) - 1) / 2 ))"

      - name: Playlistleri GitHub'a kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Turkiye.m3u Dunya.m3u Hotbird.m3u Astra.m3u

          if git diff --cached --quiet; then
            echo "Playlistlerde değişiklik yok."
            exit 0
          fi

          git commit -m "Auto-update IPTV playlists"

          git pull --rebase origin main

          git push origin main

name: Update IPTV Playlist

on:
  schedule:
    # Her gün 04:00 UTC'de güncelle
    - cron: "0 4 * * *"

  # Actions ekranından elle çalıştırabilmek için
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repository'yi al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Playlist oluştur
        run: python update_playlist.py

      - name: Güncel playlist'i kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add world.m3u
          git diff --cached --quiet || git commit -m "Auto-update IPTV playlist"
          git push

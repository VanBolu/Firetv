name: Update IPTV Playlists

on:
  schedule:
    # Her gün Almanya saatiyle yaklaşık 06:00
    # GitHub cron UTC kullanır.
    - cron: "0 4 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repository'yi al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Playlistleri oluştur
        run: python update_playlist.py

      - name: Oluşturulan dosyaları kontrol et
        run: |
          echo "Oluşturulan M3U dosyaları:"
          ls -lh *.m3u

          echo ""
          echo "Kanal sayıları:"
          echo "Turkiye: $(( $(wc -l < Turkiye.m3u) / 2 ))"
          echo "Dunya: $(( $(wc -l < Dunya.m3u) / 2 ))"
          echo "Hotbird: $(( $(wc -l < Hotbird.m3u) / 2 ))"
          echo "Astra: $(( $(wc -l < Astra.m3u) / 2 ))"

      - name: Playlistleri GitHub'a kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Turkiye.m3u Dunya.m3u Hotbird.m3u Astra.m3u

          git diff --cached --quiet || git commit -m "Auto-update IPTV playlists"

          git push
